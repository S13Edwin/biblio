<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Notion</title>
<style>
body{font:16px/1.45 system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;background:#f2f4f8;color:#14202e}
h1{font-size:1.4rem}.box{background:#fff;border:1px solid #d9dfe8;border-radius:10px;padding:14px;margin:12px 0}
button{background:#1e3a5f;color:#fff;border:0;border-radius:99px;padding:9px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid #e3e8ef}

<p><a href="./">← Retour à la bibliothèque</a></p>
<h1>Importer ma bibliothèque Notion (CSV)</h1>
<div id="auth" class="box"></div>
<div id="step" hidden>
<div class="box"><b>1. Choisis ton fichier CSV exporté de Notion</b><p><input type="file" id="file" accept=".csv,text/csv"></p>
<label><input type="checkbox" id="sel"> Ranger la colonne « Sélection » dans le champ Collection (sinon elle est ignorée)</label></div>
<div id="prev"></div></div>
<div class="box" id="isb" hidden><b>Compléter les ISBN (optionnel)</b><p class="s">Relit ton CSV Notion et renseigne l'ISBN quand le lien en contient un. Aucun doublon créé.</p><input type="file" id="f2" accept=".csv,text/csv"> <span id="r2"></span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="import.js"></script></body></html>
